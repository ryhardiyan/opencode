name: Build universal + 32-bit ARM APK

# Produces an ARM-only universal APK (armeabi-v7a + arm64-v8a) and, on
# demand, per-ABI APKs. No repository secrets are needed: the release build
# falls back to the local debug keystore already configured in
# android/app/build.gradle.
on:
  workflow_dispatch:
    inputs:
      per_abi:
        description: Also build per-ABI APKs (armeabi-v7a, arm64-v8a, universal)
        type: boolean
        default: true
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/.cxx
          key: ${{ runner.os }}-gradle-arm32-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-arm32-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (ABI config plugin runs here)
        run: npx expo prebuild --platform android --no-install

      - name: Assert generated config keeps 32-bit ARM
        run: |
          set -euo pipefail
          grep -q '^reactNativeArchitectures=armeabi-v7a,arm64-v8a$' android/gradle.properties
          grep -q 'abiFilters(\*enabledAbis)' android/app/build.gradle
          grep -q 'universalApk true' android/app/build.gradle
          echo "OK: generated Android config includes armeabi-v7a + arm64-v8a"

      - name: Disable Sentry source-map upload (no secrets required)
        # Mirrors build.yml's F-Droid job: sentry.gradle registers an upload
        # task that calls sentry-cli, which hard-fails the build without
        # SENTRY_AUTH_TOKEN. This workflow intentionally has no secrets.
        run: sed -i '/apply from.*sentry.gradle/d' android/app/build.gradle

      - name: Local debug signing (no secrets required)
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build universal ARM APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK carries 32-bit and 64-bit ARM libs
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          LIBS="$(unzip -l "$APK")"
          case "$LIBS" in
            *'lib/armeabi-v7a/libhermes.so'*) ;;
            *) echo "::error::missing 32-bit (armeabi-v7a) libs in $APK"; exit 1 ;;
          esac
          case "$LIBS" in
            *'lib/arm64-v8a/libhermes.so'*) ;;
            *) echo "::error::missing 64-bit (arm64-v8a) libs in $APK"; exit 1 ;;
          esac
          echo "OK: $APK contains both armeabi-v7a and arm64-v8a"

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-arm-universal
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build per-ABI APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.per_abi }}
        working-directory: android
        run: ./gradlew assembleRelease -Pandroid.enableAbiSplits=true --no-daemon

      - name: Upload per-ABI APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.per_abi }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-arm-per-abi
          path: |
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-universal-release.apk
